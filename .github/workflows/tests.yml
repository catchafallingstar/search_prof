name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scholarradar
          POSTGRES_USER: scholarradar_app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholarradar_app -d scholarradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://scholarradar_app:ci-only-password@localhost:5432/scholarradar
      OPENALEX_EMAIL: ci@example.com
      PUBLIC_RADAR_ENABLED: "false"
      DEV_USER_EMAIL: ci-owner@example.test
      DEV_USER_NAME: CI Test Owner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.apply_schema
      - name: Bootstrap CI owner
        run: python -m scripts.bootstrap_owner --email "$DEV_USER_EMAIL" --name "$DEV_USER_NAME" --create-local-user
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.smoke_test_db
      - run: python -m scripts.smoke_test_streamlit
