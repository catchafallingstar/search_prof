name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scholarradar
          POSTGRES_USER: scholarradar_app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholarradar_app -d scholarradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://scholarradar_app:ci-only-password@localhost:5432/scholarradar
      OPENALEX_EMAIL: ci@example.com
      PUBLIC_RADAR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.apply_schema
      # The historical test suite is not currently tracked in this repository.
      # Run it when present (for local/private test bundles), but do not fail a
      # clean checkout merely because the optional directory is absent.
      - name: Run unit tests when available
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "No tracked tests directory; continuing with smoke tests."
          fi
      - run: python -m scripts.smoke_test_db
      - run: python -m scripts.smoke_test_streamlit
